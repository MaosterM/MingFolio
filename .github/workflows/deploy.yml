# Builds the site and publishes dist/ to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # also allows a manual run from the Actions tab

# Least privilege: read the code, write only to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Not `npm ci`: the lockfile is generated on Windows, and npm leaves out the dependencies of
      # optional packages for other platforms (here Rolldown's WebAssembly fallback needs @emnapi/*).
      # `npm ci` rejects that gap; `npm install` keeps every version in the lockfile and only fills it.
      - run: npm install --no-audit --no-fund

      # Type-check + production build into dist/ (see package.json "build").
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
